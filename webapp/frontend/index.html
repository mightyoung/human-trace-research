<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)" />
    <meta name="description" content="多机位人员追踪控制台：可视化、素材标注、跨镜头 ReID、聚类工作台与算法配置。" />
    <title>human-count · 多机位人员追踪控制台</title>
    <script>
      // 主题引导：在首帧前确定主题，避免闪白/闪黑
      (function () {
        try {
          var saved = localStorage.getItem('hc-theme')
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
